[package]
name = "moniker-gui"
description = "Moniker GTK4/VTE terminal emulator"
version.workspace = true
edition.workspace = true
# gtk4-rs 0.11 (gtk4, gdk4, glib, gio, cairo-rs ...) requires Rust 1.92, so the GUI
# needs a newer compiler than the rest of the workspace.
rust-version = "1.92"
publish.workspace = true
license.workspace = true

[[bin]]
name = "moniker"
path = "src/main.rs"

[dependencies]
async-channel = "2.5.0"
gtk4 = "0.11.5"
libadwaita = { version = "0.9.2", features = ["v1_9"] }
libc = "0.2.190"
moniker-core = { path = "../moniker-core" }
rustix = { version = "1.1.5", features = ["process", "system", "termios"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = { version = "0.3.55", default-features = false }
vte4 = { version = "0.10.0", features = ["gtk_v4_18", "v0_76"] }
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"
