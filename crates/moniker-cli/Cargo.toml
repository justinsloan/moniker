[package]
name = "moniker-cli"
description = "Moniker command line: profile management and sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "moniker-server"
path = "src/main.rs"

[[bin]]
name = "moniker-askpass"
path = "src/bin/moniker-askpass.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
moniker-core = { path = "../moniker-core" }
zeroize = "1.9.1"

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
