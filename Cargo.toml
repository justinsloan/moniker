[workspace]
resolver = "3"
members = ["crates/moniker-core", "crates/moniker-cli", "crates/moniker-gui"]

[workspace.package]
version = "0.7.0"
edition = "2024"
# The oldest compiler moniker-core and moniker-cli build with: std's File::lock
# (the profile store's lock) is stable since 1.89, and so is uuid 1.28's own
# requirement. moniker-gui needs more, see its Cargo.toml.
rust-version = "1.89"
publish = false
license = "MIT"
repository = "https://github.com/justinsloan/moniker"

# Dependencies are optimized even in dev builds: Argon2 is unusably slow unoptimized.
[profile.dev.package."*"]
opt-level = 3
